<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>diego.bot — el Diez que te contesta cualquiera</title>
  <meta name="description" content="Chatbot de homenaje: te hace esperar, te contesta cualquiera y te mete un ehhhh entre cada palabra." />
  <link rel="icon" href="favicon.svg?v=__VERSION__" type="image/svg+xml" />
  <link rel="stylesheet" href="estilos.css?v=__VERSION__" />
</head>
<body>
  <header>
    <div class="diez" aria-hidden="true">10</div>
    <div class="titulos">
      <h1>diego<span class="punto">.</span>bot</h1>
      <p>Tirale un centro. Se toma uno o dos segundos, la piensa y te contesta cualquiera.</p>
    </div>
  </header>

  <main>
    <div class="cinta" aria-hidden="true"></div>
    <div id="chat" role="log" aria-live="polite" aria-label="Conversacion"></div>
    <form id="formulario" autocomplete="off">
      <input id="entrada" type="text" placeholder="Tirale algo al Diez..." aria-label="Tu mensaje" required />
      <button id="enviar" type="submit">Centro</button>
    </form>
  </main>

  <footer>
    Homenaje de hincha, sin relacion con Diego Armando Maradona ni su familia.
    Las respuestas son un chiste y salen de una lista fija. Corre entero en tu
    navegador, no hay servidor.
  </footer>

  <script type="module" src="app.js?v=__VERSION__"></script>
</body>
</html>
